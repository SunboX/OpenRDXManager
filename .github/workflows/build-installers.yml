name: Build installers

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
    workflow_dispatch:
        inputs:
            publish_release:
                description: Publish the package.json version after all six builds pass.
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: installers-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: false

jobs:
    build:
        name: Build ${{ matrix.platform }} ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: false
            OPENRDX_VISUAL_QA_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/out/visual-qa-diagnostics
            OPENRDX_VISUAL_QA_TRACE: '1'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { platform: mac, arch: x64, runner: macos-15-intel }
                    - { platform: mac, arch: arm64, runner: macos-14 }
                    - { platform: win, arch: x64, runner: windows-2025-vs2026 }
                    - { platform: win, arch: arm64, runner: windows-11-arm }
                    - { platform: linux, arch: x64, runner: ubuntu-24.04 }
                    - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-node@v6.4.0
              with:
                  node-version-file: .nvmrc
                  architecture: ${{ matrix.arch }}
                  cache: npm
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Install Linux dependencies
              if: matrix.platform == 'linux'
              run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-0 libudev-dev rpm
            - run: npm ci
            - name: Configure Linux Electron sandbox
              if: matrix.platform == 'linux'
              run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
            - run: npm run format:check
            - run: npm run native:test
            - name: Verify Windows shared local trust policy
              if: matrix.platform == 'win'
              run: cargo test --manifest-path native/rdx-service/local-trust/Cargo.toml --locked
            - name: Verify Windows native security and installer policy
              if: matrix.platform == 'win'
              run: cargo test --manifest-path native/rdx-service/windows-native/Cargo.toml --locked
            - name: Verify protected Windows service descriptor on disposable runner
              if: matrix.platform == 'win'
              run: cargo test --manifest-path native/rdx-service/windows-native/Cargo.toml --locked --lib service_acl::windows_impl::tests::native_service_setter_retains_exact_protected_dacl -- --ignored --exact --nocapture
            - name: Observe restricted Windows token on disposable runner
              if: matrix.platform == 'win'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path out/verification | Out-Null
                  node scripts/verify-windows-restricted-token-probe.mjs | Tee-Object -FilePath out/verification/windows-token-baseline.log
                  $probeExitCode = $LASTEXITCODE
                  exit $probeExitCode
            - name: Verify medium restricted Windows token on disposable runner
              if: matrix.platform == 'win'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path out/verification | Out-Null
                  node scripts/verify-windows-restricted-token-probe.mjs --medium | Tee-Object -FilePath out/verification/windows-token-medium.log
                  $probeExitCode = $LASTEXITCODE
                  exit $probeExitCode
            - name: Compile private Windows token child fixtures
              id: windows-token-fixtures
              if: matrix.platform == 'win'
              shell: pwsh
              run: |
                  rustc --edition=2024 native/rdx-service/windows-native/tests/fixtures/token-child.rs -o out/verification/openrdx-token-child.exe
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  rustc --edition=2024 --cfg token_fixture_hang native/rdx-service/windows-native/tests/fixtures/token-child.rs -o out/verification/openrdx-token-wait-child.exe
                  exit $LASTEXITCODE
            - name: Verify owned medium Windows child on disposable runner
              if: matrix.platform == 'win'
              shell: pwsh
              run: |
                  node scripts/verify-windows-restricted-token-probe.mjs --child | Tee-Object -FilePath out/verification/windows-token-child.log
                  $probeExitCode = $LASTEXITCODE
                  exit $probeExitCode
            - name: Observe source-context Windows child control
              if: always() && matrix.platform == 'win' && steps.windows-token-fixtures.outcome == 'success'
              continue-on-error: true
              shell: pwsh
              run: |
                  node scripts/verify-windows-restricted-token-probe.mjs --source-control | Tee-Object -FilePath out/verification/windows-token-source-control.log
                  $probeExitCode = $LASTEXITCODE
                  exit $probeExitCode
            - name: Observe isolated Windows process DACL control
              if: always() && matrix.platform == 'win' && steps.windows-token-fixtures.outcome == 'success'
              continue-on-error: true
              shell: pwsh
              run: |
                  node scripts/verify-windows-restricted-token-probe.mjs --process-dacl-control | Tee-Object -FilePath out/verification/windows-token-process-dacl-control.log
                  $probeExitCode = $LASTEXITCODE
                  exit $probeExitCode
            - name: Observe fixed Windows object DACL matrix
              if: always() && matrix.platform == 'win' && steps.windows-token-fixtures.outcome == 'success'
              continue-on-error: true
              shell: pwsh
              run: |
                  node scripts/verify-windows-restricted-token-probe.mjs --object-dacl-controls | Tee-Object -FilePath out/verification/windows-token-object-dacl-matrix.log
                  $probeExitCode = $LASTEXITCODE
                  exit $probeExitCode
            - name: Upload closed Windows token evidence
              if: always() && matrix.platform == 'win'
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: windows-token-diagnostics-${{ matrix.arch }}
                  path: |
                      out/verification/windows-token-baseline.log
                      out/verification/windows-token-medium.log
                      out/verification/windows-token-child.log
                      out/verification/windows-token-source-control.log
                      out/verification/windows-token-process-dacl-control.log
                      out/verification/windows-token-object-dacl-matrix.log
                  if-no-files-found: ignore
                  retention-days: 3
            - name: Verify Windows PowerShell installer boundary
              if: matrix.platform == 'win'
              run: powershell -NoProfile -ExecutionPolicy Bypass -File native/rdx-service/windows-native/tests/installer_script_contract.ps1
            - name: Verify local trust policy and macOS installer
              if: matrix.platform == 'mac'
              run: |
                  cargo test --manifest-path native/rdx-service/local-trust/Cargo.toml --locked
                  cargo test --manifest-path native/local-install/macos/Cargo.toml --locked
                  cargo test --manifest-path native/rdx-service/macos-native/Cargo.toml --locked --all-features
            - name: Build installers
              run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
            - name: Install and verify the macOS PKG
              if: matrix.platform == 'mac'
              shell: bash
              run: bash scripts/verify-macos-installation.sh
            - name: Install and verify the Windows EXE
              if: matrix.platform == 'win'
              shell: pwsh
              run: |
                  $version = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
                  $installer = Join-Path $env:GITHUB_WORKSPACE "dist/installers/OpenRDXManager-$version-win-${{ matrix.arch }}.exe"
                  & ./scripts/verify-windows-installation.ps1 -Installer $installer -Workspace $env:GITHUB_WORKSPACE -NodePath (Get-Command node).Source
            - name: Test application on macOS and Windows
              if: matrix.platform != 'linux'
              run: npm test
            - name: Test application on Linux
              if: matrix.platform == 'linux'
              run: xvfb-run -a npm test
            - name: Verify packaged application on macOS and Windows
              if: matrix.platform != 'linux'
              run: npm run verify:packaged-app
            - name: Install and verify the Linux DEB
              if: matrix.platform == 'linux'
              shell: bash
              run: |
                  sudo apt-get install -y ./dist/installers/*.deb
                  sudo systemctl start openrdx-hardware.service
                  # Prove startup opened its namespace; no client session or device command is sent.
                  sudo timeout 8s python3 - <<'PY'
                  import os
                  from pathlib import Path
                  import re
                  import stat
                  import subprocess
                  import time

                  # Consume the owning native path contract compiled into this same build.
                  endpoint_source = Path('native/rdx-service/linux-native/src/endpoint.rs').read_text(encoding='utf-8')
                  manager_paths = re.findall(r'^const MANAGER_PATH: &str = "([^"]+)";$', endpoint_source, re.MULTILINE)
                  if len(manager_paths) != 1:
                      raise SystemExit('Linux manager identity contract is missing or ambiguous')
                  manager = os.stat(manager_paths[0], follow_symlinks=False)
                  if not stat.S_ISREG(manager.st_mode) or manager.st_uid != 0 or manager.st_gid != 0 or manager.st_mode & 0o022:
                      raise SystemExit('Installed manager is not a private root-owned regular executable matching its contract')
                  print('Installed manager regular-file identity and root ownership verified')

                  lock_path = '/run/openrdx/openrdx-hardware.lock'
                  deadline = time.monotonic() + 5
                  verified = False

                  def service_state():
                      """Read bounded systemd process/state evidence without contacting the service."""
                      result = subprocess.run(
                          ['systemctl', 'show', 'openrdx-hardware.service',
                           '--property=MainPID', '--property=ActiveState', '--property=SubState'],
                          check=True, capture_output=True, text=True, timeout=1,
                      )
                      return dict(line.split('=', 1) for line in result.stdout.splitlines())

                  while time.monotonic() < deadline:
                      state = service_state()
                      pid = state.get('MainPID', '')
                      if state.get('ActiveState') == 'active' and state.get('SubState') == 'running' and pid.isdecimal() and int(pid) > 0:
                          try:
                              namespace = os.stat(lock_path, follow_symlinks=False)
                              if not stat.S_ISREG(namespace.st_mode) or namespace.st_uid != 0 or namespace.st_gid != 0 or stat.S_IMODE(namespace.st_mode) != 0o600 or namespace.st_nlink != 1:
                                  raise SystemExit('Installed ownership namespace metadata is invalid')
                              if os.readlink(f'/proc/{pid}/exe') != '/usr/libexec/openrdx-hardware':
                                  raise SystemExit('systemd MainPID is not the installed hardware service')
                              for descriptor in os.scandir(f'/proc/{pid}/fd'):
                                  if os.readlink(descriptor.path) == lock_path:
                                      opened = os.stat(descriptor.path)
                                      if (opened.st_dev, opened.st_ino) == (namespace.st_dev, namespace.st_ino) and service_state() == state:
                                          verified = True
                                          break
                          except FileNotFoundError:
                              pass  # Startup/retirement can change the process between bounded reads.
                      if verified:
                          break
                      time.sleep(0.1)

                  if not verified:
                      raise SystemExit('Installed service did not initialize the exact ownership namespace while active')
                  print('Installed service startup and ownership namespace verified; no device command sent')
                  PY
                  xvfb-run -a npm run verify:packaged-app -- --installed
            - name: Upload installers
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: installers-${{ matrix.platform }}-${{ matrix.arch }}
                  path: |
                      dist/installers/*.dmg
                      dist/installers/*.pkg
                      dist/installers/*.zip
                      dist/installers/*.exe
                      dist/installers/*.AppImage
                      dist/installers/*.deb
                      dist/installers/*.tar.gz
                  if-no-files-found: error
                  retention-days: 14
            - name: Upload visual failure evidence
              if: failure()
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: visual-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
                  path: out/visual-qa-diagnostics
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Upload Windows installer failure evidence
              if: failure() && matrix.platform == 'win'
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: windows-installer-diagnostics-${{ matrix.arch }}
                  path: |
                      dist/installers/*.exe
                      dist/installers/*.zip
                  if-no-files-found: ignore
                  retention-days: 3

    collect:
        name: Verify and collect all installers
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-node@v6.4.0
              with:
                  node-version-file: .nvmrc
            - uses: actions/download-artifact@v8.0.1
              with:
                  pattern: installers-*
                  path: dist/installers
                  merge-multiple: true
            - name: Verify complete installer inventory and generate checksums
              run: node scripts/release-assets.mjs
            - uses: actions/upload-artifact@v7.0.1
              with:
                  name: installers-all
                  path: dist/installers/*
                  if-no-files-found: error
                  retention-days: 14
    release:
        name: Publish verified release
        needs: collect
        if: >-
            (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-node@v6.4.0
              with:
                  node-version-file: .nvmrc
            - uses: actions/download-artifact@v8.0.1
              with:
                  name: installers-all
                  path: dist/installers
            - name: Recheck downloaded release inventory
              run: node scripts/release-assets.mjs
            - name: Publish complete release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
                  tag="v${version}"
                  if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
                      echo 'Release tag does not match package.json' >&2
                      exit 1
                  fi
                  if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      echo 'Release already exists; refusing to replace published assets' >&2
                      exit 1
                  fi
                  gh release create "$tag" dist/installers/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OpenRDXManager ${version}" --notes-file docs/releases/locally-trusted-installers.md --draft
                  gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
