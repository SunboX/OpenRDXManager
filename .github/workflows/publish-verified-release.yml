name: Publish verified release

on:
    workflow_dispatch:
        inputs:
            build_run_id:
                description: Completed successful main Build installers run ID.
                required: true
                type: string
            publish_release:
                description: Publish after verification. False saves verification evidence only.
                required: false
                default: false
                type: boolean

permissions:
    contents: read
    actions: read

concurrency:
    group: verified-release-publication
    cancel-in-progress: false

jobs:
    verify:
        name: Verify successful build and exact candidate assets
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
            actions: read
        outputs:
            source_commit: ${{ steps.metadata.outputs.source_commit }}
            run_id: ${{ steps.metadata.outputs.run_id }}
        env:
            BUILD_RUN_ID: ${{ inputs.build_run_id }}
        steps:
            - uses: actions/checkout@v6.0.2
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6.4.0
              with:
                  node-version-file: .nvmrc
            - name: Fetch authenticated build metadata
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  node --input-type=module -e 'const id = process.env.BUILD_RUN_ID; if (!/^[1-9][0-9]*$/.test(id) || !Number.isSafeInteger(Number(id))) process.exit(1)'
                  mkdir -p verification
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > verification/build-run.json
            - name: Validate build provenance before downloading artifacts
              id: metadata
              run: node scripts/verify-release-candidate.mjs metadata verification/build-run.json
            - name: Read only the exact candidate source
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ steps.metadata.outputs.source_commit }}
                  path: candidate-source
                  persist-credentials: false
                  sparse-checkout: |
                      package.json
                      docs/releases/locally-trusted-installers.md
                  sparse-checkout-cone-mode: false
            - uses: actions/download-artifact@v8.0.1
              with:
                  name: installers-all
                  path: verification/installers
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ steps.metadata.outputs.run_id }}
            - name: Recheck current build attempt
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > verification/build-run.json
            - name: Verify complete assets and bind the exact build attempt
              env:
                  EXPECTED_SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
                  EXPECTED_RUN_ATTEMPT: ${{ steps.metadata.outputs.run_attempt }}
              run: node scripts/verify-release-candidate.mjs verify verification/build-run.json candidate-source verification/installers verification/candidate.json
            - name: Retain exact verified inputs
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      verification/build-run.json
                      verification/candidate.json
                      verification/installers/OpenRDXManager-*.dmg
                      verification/installers/OpenRDXManager-*.pkg
                      verification/installers/OpenRDXManager-*.zip
                      verification/installers/OpenRDXManager-*.exe
                      verification/installers/OpenRDXManager-*.AppImage
                      verification/installers/OpenRDXManager-*.deb
                      verification/installers/OpenRDXManager-*.tar.gz
                      verification/installers/SHA256SUMS.txt
                  if-no-files-found: error
                  retention-days: 3

    publish:
        name: Publish only the reverified candidate
        needs: verify
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: write
            actions: read
        env:
            BUILD_RUN_ID: ${{ needs.verify.outputs.run_id }}
            CANDIDATE_PATH: verification/candidate.json
            PUBLISH_RELEASE: ${{ inputs.publish_release }}
        steps:
            - uses: actions/checkout@v6.0.2
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6.4.0
              with:
                  node-version-file: .nvmrc
            - uses: actions/download-artifact@v8.0.1
              with:
                  name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
                  path: verification
            - name: Read only the verified candidate source
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ needs.verify.outputs.source_commit }}
                  path: candidate-source
                  persist-credentials: false
                  sparse-checkout: |
                      package.json
                      docs/releases/locally-trusted-installers.md
                  sparse-checkout-cone-mode: false
            - name: Refresh authenticated build metadata before publication
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  node --input-type=module -e 'const id = process.env.BUILD_RUN_ID; if (!/^[1-9][0-9]*$/.test(id) || !Number.isSafeInteger(Number(id))) process.exit(1)'
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > verification/build-run.json
            - name: Repeat candidate validation before any release write
              run: node scripts/verify-release-candidate.mjs verify verification/build-run.json candidate-source verification/installers verification/rechecked-candidate.json verification/candidate.json
            - name: Publish the exact fully verified release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/publish-verified-release.mjs verification/build-run.json candidate-source verification/installers
